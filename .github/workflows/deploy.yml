name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # A repo named <owner>.github.io is served from the root; any other repo from /<repo-name>.
      - name: Work out site URL and base path
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          echo "SITE_URL=https://${OWNER,,}.github.io" >> "$GITHUB_ENV"
          if [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${REPO}" >> "$GITHUB_ENV"
          fi

      - run: npm run build
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}
          PUBLIC_ASK_API_URL: ${{ vars.ASK_API_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.ASK_TURNSTILE_SITE_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
