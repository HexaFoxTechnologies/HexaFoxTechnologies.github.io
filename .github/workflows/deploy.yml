name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # A repo named <owner>.github.io is served from the root; any other repo from /<repo-name>.
      - name: Work out site URL and base path
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          echo "SITE_URL=https://${OWNER,,}.github.io" >> "$GITHUB_ENV"
          if [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${REPO}" >> "$GITHUB_ENV"
          fi

      - run: npm run build
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The chat (FoxDesk) answers from a crawl of the live site. Once the new pages are out, start
  # FoxDesk's Refresh knowledge workflow; it only re-embeds and redeploys if the text changed.
  # The token is fine-grained: Actions read & write on foxdesk only. Without it, FoxDesk's daily
  # re-crawl picks changes up instead.
  refresh-chat:
    name: Refresh the chat's knowledge
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Ask FoxDesk to re-crawl the site
        env:
          GH_TOKEN: ${{ secrets.FOXDESK_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::FOXDESK_DISPATCH_TOKEN isn't set, so the chat refreshes on FoxDesk's daily schedule (README → Chat)."
            exit 0
          fi
          # Call the dispatch API directly: `gh workflow run` first looks up the default branch,
          # which needs Contents access that this Actions-only token deliberately doesn't have.
          gh api -X POST repos/HexaFoxTechnologies/foxdesk/actions/workflows/refresh.yml/dispatches \
            -f ref=main -f 'inputs[client]=hexafox'
