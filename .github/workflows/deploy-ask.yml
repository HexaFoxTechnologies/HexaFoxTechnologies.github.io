name: Deploy Ask HexaFox

# Deploys the Ask HexaFox Worker (workers/ask-hexafox) to Cloudflare when it, or the site copy it
# answers from, changes on main. It ships the committed corpus.json; CI's knowledge check keeps
# that in step with src/data, and the same check runs here as a last guard.
# Needs the CLOUDFLARE_API_TOKEN repository secret (see the README's Ask HexaFox section).
on:
  push:
    branches: [main]
    paths:
      - workers/ask-hexafox/**
      - src/data/**
      - .github/workflows/deploy-ask.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ask-hexafox
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ask-hexafox
      url: https://ask-hexafox.hexafox.workers.dev
    steps:
      - name: Check the Cloudflare token is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (README → Ask HexaFox)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/ask-hexafox/package-lock.json

      # The knowledge check reads src/data through the site's own Vite, so it needs both installs.
      - run: npm ci
      - run: npm ci
        working-directory: workers/ask-hexafox

      - run: npm run knowledge:check
        working-directory: workers/ask-hexafox

      # Wrangler comes from the Worker's lockfile. Secrets on the Worker (model keys) are untouched.
      - run: npm run deploy
        working-directory: workers/ask-hexafox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
